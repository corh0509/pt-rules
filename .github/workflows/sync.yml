name: Sync Rules

on:
  schedule:
    - cron: '0 3 * * *' # 每天 UTC 3 点（北京时间 11 点）自动运行
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download rules
        run: |
          mkdir -p ruleset
          curl -fsSL "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt" -o ruleset/direct.txt
          curl -fsSL "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt"  -o ruleset/proxy.txt
          curl -fsSL "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt"  -o ruleset/apple.txt
          curl -fsSL "https://raw.githubusercontent.com/binaryu/emos-proxy-rule/main/rules/emos-mihomo.yaml" -o ruleset/emos-mihomo.yaml
          curl -fsSL "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"  -o geoip.dat
          curl -fsSL "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat" -o geosite.dat

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto sync rules: $(date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Keepalive
        if: success()
        run: |
          echo "Last keepalive: $(date '+%Y-%m-%d %H:%M:%S')" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          if git diff --cached --quiet; then
            echo "No changes to commit for keepalive"
          else
            git commit -m "Keepalive: $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
